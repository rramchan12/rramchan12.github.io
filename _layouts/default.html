<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/dark-theme.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Ravi Ramchandran",
      "url": "{{ site.url }}",
      "jobTitle": "Principal Group Engineering Manager / Director, Software Engineering",
      "description": {{ page.description | default: site.description | jsonify }},
      "worksFor": {
        "@type": "Organization",
        "name": "Microsoft"
      },
      "sameAs": [
        "https://www.linkedin.com/in/raviramchandran/",
        "https://github.com/rramchan12",
        "https://github.com/rramchan12/LJMU_MLAI_RR",
        "https://github.com/rramchan12/HateSpeechDetection_ver2"
      ],
      "subjectOf": [
        {
          "@type": "Article",
          "name": "How I Built a Mini Gas Town to Learn Agent Orchestration",
          "url": "https://www.linkedin.com/pulse/how-i-built-mini-gas-town-learn-agent-orchestration-ravi-ramchandran-czm9c"
        },
        {
          "@type": "VideoObject",
          "name": "Enterprise AI Field Notes: Agents at Work, Live Demo, Guardrails + Responsible Innovation",
          "url": "https://www.youtube.com/watch?v=swmjPx4eAeU"
        },
        {
          "@type": "VideoObject",
          "name": "Hate Speech Detection Using LLMs: Integrating Persona-Based and Policy-Based Techniques",
          "url": "https://www.youtube.com/watch?v=as4R0HoSrik"
        },
        {
          "@type": "CreativeWork",
          "name": "System and Method for Business Process Monitoring",
          "identifier": "US11340906B2",
          "url": "https://patents.google.com/patent/US11340906B2/en"
        },
        {
          "@type": "CreativeWork",
          "name": "Continuous Data Quality Assessment and Monitoring for Big Data",
          "identifier": "US11587012B2",
          "url": "https://patents.google.com/patent/US11587012B2/en"
        }
      ],
      "knowsAbout": [
        "Enterprise AI platforms",
        "Agentic AI systems",
        "AI-agent evaluation",
        "Enterprise administration",
        "Distributed systems",
        "Machine learning experimentation",
        "Search and ranking systems",
        "Engineering leadership"
      ]
    }
    </script>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-container">
        <a href="{{ '/' | relative_url }}" class="nav-brand">{{ site.title }}</a>
        <div class="nav-links">
          <a href="{{ '/#about' | relative_url }}" class="nav-link">About</a>
          <a href="{{ '/#experience' | relative_url }}" class="nav-link">Experience</a>
          <a href="{{ '/#skills' | relative_url }}" class="nav-link">Skills</a>
          <a href="{{ '/#proof' | relative_url }}" class="nav-link">Proof</a>
          <a href="{{ '/#speaking' | relative_url }}" class="nav-link">Speaking</a>
          <a href="{{ '/#contact' | relative_url }}" class="nav-link">Contact</a>
        </div>
      </div>
    </nav>

    <main class="main-content">
      {{ content }}
    </main>

    <footer class="footer">
      <div class="footer-content">
        <div class="footer-text">
          <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}.</p>
        </div>
        <div class="footer-social">
          <a href="https://github.com/rramchan12" class="social-link" aria-label="GitHub" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://www.linkedin.com/in/raviramchandran/" class="social-link" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-linkedin"></i>
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
